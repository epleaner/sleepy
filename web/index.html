<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171412">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nappy">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Nappy</title>
</head>
<body>
  <section id="household-gate" class="household-gate" aria-labelledby="household-title">
    <div class="gate-card">
      <p class="eyebrow">Nappy</p>
      <h1 id="household-title">Your household</h1>
      <p class="gate-intro">Share one simple sleep log with everyone who helps care for your little one.</p>
      <button id="create-household" class="primary-button wake" type="button">Start a household</button>
      <div class="gate-divider"><span>or</span></div>
      <form id="join-form">
        <label for="household-code">Join with a household ID</label>
        <div class="join-row">
          <input id="household-code" name="household" inputmode="text" autocomplete="off" placeholder="C0FFEE42" maxlength="8" required>
          <button class="secondary-button" type="submit">Join</button>
        </div>
      </form>
      <p id="household-error" class="form-error" role="alert"></p>
    </div>
  </section>

  <main id="app" class="app-shell hidden">
    <section id="timer-screen" class="screen" aria-labelledby="app-title">
      <header class="screen-header">
        <div class="screen-title-row">
          <h1 id="app-title">Nappy</h1>
          <button id="share-household" class="share-button" type="button">Share household</button>
        </div>
        <p id="today-date" class="muted"></p>
      </header>
      <div id="timer-card-mount"></div>
      <section id="daily-totals" class="panel" aria-labelledby="totals-title"></section>
      <section id="mode-controls" aria-label="Timer controls"></section>
      <section id="today-entries" class="panel" aria-labelledby="entries-title"></section>
    </section>

    <section id="entries-screen" class="screen hidden" aria-labelledby="entries-screen-title">
      <header class="screen-header compact-header">
        <h1 id="entries-screen-title">Entries</h1>
      </header>
      <div id="entries-list"></div>
    </section>

    <section id="insights-screen" class="screen hidden" aria-labelledby="insights-screen-title">
      <header class="screen-header compact-header">
        <h1 id="insights-screen-title">Insights</h1>
      </header>
      <div id="insights-content"></div>
    </section>

    <section id="settings-screen" class="screen hidden" aria-labelledby="settings-screen-title">
      <header class="screen-header compact-header">
        <h1 id="settings-screen-title">Settings</h1>
      </header>
      <div id="settings-content"></div>
    </section>

    <nav class="tab-bar" aria-label="Primary navigation">
      <button class="tab-button active" data-tab="timer" aria-label="Timer" aria-selected="true">
        <span class="tab-icon" aria-hidden="true">◴</span><span>Timer</span>
      </button>
      <button class="tab-button" data-tab="entries" aria-label="Entries" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">☷</span><span>Entries</span>
      </button>
      <button class="tab-button" data-tab="insights" aria-label="Insights" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">▥</span><span>Insights</span>
      </button>
      <button class="tab-button" data-tab="settings" aria-label="Settings" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">⚙</span><span>Settings</span>
      </button>
    </nav>
  </main>

  <div id="edit-modal" class="modal-backdrop hidden" role="presentation">
    <form id="edit-form" class="modal" aria-labelledby="edit-title">
      <div class="modal-header">
        <h2 id="edit-title">Edit entry</h2>
        <button id="cancel-edit" class="icon-button" type="button" aria-label="Cancel edit">×</button>
      </div>
      <label>Type
        <select id="edit-mode" name="mode">
          <option value="wake">Wake</option>
          <option value="nap">Sleep</option>
        </select>
      </label>
      <label>Started
        <input id="edit-started" name="startedAt" type="datetime-local" required>
      </label>
      <label>Duration in minutes
        <input id="edit-duration" name="duration" type="number" min="0" step="1" required>
      </label>
      <div class="modal-actions">
        <button id="cancel-edit-secondary" class="secondary-button" type="button">Cancel</button>
        <button class="primary-button" type="submit">Save</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script type="module" src="app.js?v=8"></script>
</body>
</html>
